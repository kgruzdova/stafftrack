name: Publish StaffTrack

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: stafftrack-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm run build
      - name: Check Cloudflare connection
        id: connection
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Build succeeded. Deployment needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN in repository Secrets."
            echo "### Site not deployed" >> "$GITHUB_STEP_SUMMARY"
            echo "Add the two Cloudflare Secrets, then run this workflow again. See docs/DEPLOYMENT.md." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Publish server, database and file storage
        if: steps.connection.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_NAME: ${{ vars.WORKER_NAME || 'stafftrack' }}
        run: node scripts/deploy-cloudflare.mjs
      - name: Store verified build
        if: steps.connection.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stafftrack-build
          path: dist/
          retention-days: 7
